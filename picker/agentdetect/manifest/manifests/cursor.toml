id = "cursor"
match_commands = ["cursor-agent"]

[[rules]]
# Older TUI (≤2026.07.23): braille spinner line above the input bar.
state = "processing"
priority = 100
region = "last_lines:8"
regex = '[\x{2800}-\x{28FF}]+ working'

[[rules]]
# 2026.08.04+ TUI: status phrases while a turn is in flight.
state = "processing"
priority = 100
region = "last_lines:8"
regex = 'running .+ now'
not = [{ regex = 'proceed \(y\)|what to do instead' }]

[[rules]]
state = "processing"
priority = 100
region = "last_lines:8"
regex = 'creating .+ now'
not = [{ regex = 'proceed \(y\)|what to do instead' }]

[[rules]]
# Shell-tool timing line (e.g. "$ sleep 3 && echo DONE_PROBE 4.6s").
state = "processing"
priority = 100
region = "last_lines:8"
regex = '(?s)\$ .+\d+\..+s'

[[rules]]
state = "processing"
priority = 100
region = "last_lines:8"
regex = 'editing .+'
not = [{ regex = 'proceed \(y\)|what to do instead' }]

[[rules]]
# Both user-turn prompts: the approval list ("→ Proceed (y)") and the
# reject-feedback prompt cursor drops into after n/esc ("Tell the agent what to do
# instead"). Neither renders a spinner, so processing above can't shadow them.
state = "waiting"
priority = 80
region = "last_lines:8"
regex = 'proceed \(y\)|what to do instead'

[[rules]]
# Lowest priority because the "→" input arrow is always present — the approval
# prompt renders its own "→ Proceed (y)" and would otherwise read as idle. The
# placeholder text is unusable as a marker: it differs between a fresh session
# ("Plan, search, build anything") and a used one ("Add a follow-up"), and
# vanishes once the user types.
state = "idle"
priority = 10
region = "last_lines:6"
contains = ["→"]
