id = "cursor"
match_commands = ["cursor-agent"]

[[rules]]
# Older TUI (≤2026.07.23): braille spinner line above the input bar.
state = "processing"
priority = 100
region = "last_lines:8"
regex = '[\x{2800}-\x{28FF}]+ working'

[[rules]]
# 2026.08.04+ TUI: status phrases while a turn is in flight, but "Running X
# now." etc. is turn narration that stays on screen after the turn ends —
# require the footer's live-turn hint ("ctrl+c to stop") in the same window;
# it disappears the instant the composer goes idle.
state = "processing"
priority = 100
region = "last_lines:8"
regex = 'running .+ now'
contains = ["ctrl+c to stop"]
not = [{ regex = 'proceed \(y\)|what to do instead' }]

[[rules]]
state = "processing"
priority = 100
region = "last_lines:8"
regex = 'creating .+ now'
contains = ["ctrl+c to stop"]
not = [{ regex = 'proceed \(y\)|what to do instead' }]

[[rules]]
# Shell-tool timing line (e.g. "$ sleep 3 && echo DONE_PROBE 4.6s") stays on
# screen after the command finishes, so it needs the same liveness qualifier.
# Wider window than its siblings: the composer's own border row can wrap
# across two terminal lines while a "1 task" badge is showing, which pushes
# the timing line further back from the footer than the other markers sit.
state = "processing"
priority = 100
region = "last_lines:16"
regex = '(?s)\$ .+\d+\..+s'
contains = ["ctrl+c to stop"]
not = [{ regex = 'proceed \(y\)|what to do instead' }]

[[rules]]
state = "processing"
priority = 100
region = "last_lines:8"
regex = 'editing .+'
contains = ["ctrl+c to stop"]
not = [{ regex = 'proceed \(y\)|what to do instead' }]

[[rules]]
# Both user-turn prompts: the approval list ("→ Proceed (y)") and the
# reject-feedback prompt cursor drops into after n/esc ("Tell the agent what to do
# instead"). Neither renders a spinner, so processing above can't shadow them.
state = "waiting"
priority = 80
region = "last_lines:8"
regex = 'proceed \(y\)|what to do instead'

[[rules]]
# Lowest priority because the "→" input arrow is always present — the approval
# prompt renders its own "→ Proceed (y)" and would otherwise read as idle. The
# placeholder text is unusable as a marker: it differs between a fresh session
# ("Plan, search, build anything") and a used one ("Add a follow-up"), and
# vanishes once the user types.
state = "idle"
priority = 10
region = "last_lines:6"
contains = ["→"]
