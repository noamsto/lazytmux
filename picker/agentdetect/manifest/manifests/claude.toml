id = "claude"
match_commands = ["claude"]

[[rules]]
state = "processing"
priority = 100
region = "title"
regex = '^[\x{2800}-\x{28FF}] '

[[rules]]
state = "skip"
priority = 95
region = "whole"
contains = ["showing detailed transcript"]

[[rules]]
state = "skip"
priority = 94
region = "whole"
contains = ["select model", "esc to cancel"]

[[rules]]
state = "waiting"
priority = 80
region = "whole"
contains = ["do you want to proceed?"]

[[rules]]
state = "idle"
priority = 10
# last_lines:6 not :3 — real Claude renders 3 lines below the ❯ prompt (box
# bottom border, the 🤖 status line, and the -- INSERT -- mode hint), so ❯ sits
# ~4 lines from the bottom. Verified against live idle panes.
region = "last_lines:6"
regex = '❯'
not = [ { contains = ["do you want to proceed?"] } ]

# Background shells outlive the turn that started them, so this is a flag, not
# a state: the pane may be idle, processing, or waiting while it holds one.
# Anchored on the footer's `·` separator and confined to the last lines — the
# transcript is full of "Ran 9 shell commands", and old "1 shell still running"
# lines stay in the scrollback long after that shell exited.
[[flags]]
name = "bg"
region = "last_lines:3"
regex = '·\s*(\d+)\s+shells?\b'
